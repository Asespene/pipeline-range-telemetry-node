; PlatformIO Project Configuration File
; Switch active board in the VS Code bottom status bar ("Default" / "env:uno")
; or via CLI: pio run -e uno | pio run -e esp32

[platformio]
default_envs = uno
src_dir = src

[env]
framework = arduino
lib_extra_dirs = ~/Arduino/libraries
monitor_filters = direct, time

; --- Arduino Uno ---
[env:uno]
platform = atmelavr
board = uno
monitor_speed = 9600

; --- Arduino Nano (ATmega328P) ---
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
monitor_speed = 9600

; --- Arduino Nano (Old Bootloader / Clones) ---
[env:nanoatmega328old]
platform = atmelavr
board = nanoatmega328old
monitor_speed = 9600

; --- Arduino Mega 2560 ---
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
monitor_speed = 9600

; --- ESP32 DevKit V1 / NodeMCU-32S ---
[env:esp32]
platform = espressif32
board = esp32dev
monitor_speed = 115200
